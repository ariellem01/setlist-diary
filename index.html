<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Setlist Diary</title>
  <meta name="description" content="A private diary of the concerts you've been to.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5EFE2">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Setlist">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" href="fonts/nothing-you-could-do-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/anton-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Hand-drawn ink marks, reused across the app. Purely decorative. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12.3 1.9l2.5 6.7 7.2.2-5.6 4.7 2 7.1-6.3-4.1-5.8 4.2 1.5-7.2L2.1 9l7.3-.5z" fill="currentColor" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></symbol>
    <symbol id="i-star-o" viewBox="0 0 24 24"><path d="M12.3 1.9l2.5 6.7 7.2.2-5.6 4.7 2 7.1-6.3-4.1-5.8 4.2 1.5-7.2L2.1 9l7.3-.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-ast" viewBox="0 0 24 24"><path d="M12 3.5v17M4.8 7.6l14.6 8.6M19.1 7.4 4.6 16.1" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-circle" viewBox="0 0 200 60" preserveAspectRatio="none"><path d="M22 36C9 16 72 3 122 6s76 13 70 29-71 23-122 19S2 43 13 25 62 5 104 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/></symbol>
    <symbol id="i-under" viewBox="0 0 200 12" preserveAspectRatio="none"><path d="M3 8c28-5 58 2 93-2s64-4 101 1" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 64 32"><path d="M3 24C18 9 36 6 55 12M45 4.5l10.5 7.6-11 6.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 64 32"><path d="M61 20C46 8 28 7 9 13M19 5 8.5 12.8l11 6.3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9.2 17.6V5.3l10.2-2.1v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="6.6" cy="17.8" rx="2.9" ry="2.3" fill="currentColor" transform="rotate(-18 6.6 17.8)"/><ellipse cx="16.8" cy="15.4" rx="2.9" ry="2.3" fill="currentColor" transform="rotate(-18 16.8 15.4)"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M3.6 5.2c3.1-1.6 6.3-1.4 8.4.6 2.2-2 5.3-2.2 8.5-.5l-.2 14c-3.1-1.4-6.2-1.3-8.3.6-2-1.8-5.2-2-8.4-.4zM12 5.9l-.1 13.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-flyer" viewBox="0 0 24 24"><path d="M5.2 3.9 18.9 3l.9 17.1-14.7.8zM8.3 8.2l8-.4M8.5 11.9l5.6-.3M8.6 15.6l7.2-.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-bars" viewBox="0 0 24 24"><path d="M5.3 19.8v-7.6M10.1 19.9V6.3M14.9 20v-9.4M19.7 19.8V8.6M2.8 20.6l18.7-.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12.2 4.6 11.8 19.6M4.6 12.3l14.9-.4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
  </svg>

  <a class="skip" href="#app">Skip to content</a>

  <header class="topbar">
    <a href="#/shows" class="wordmark-sm" aria-label="Setlist Diary, home">Setlist Diary</a>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/shows" data-tab="shows"><svg class="ti" aria-hidden="true"><use href="#i-book"/></svg><span>My Shows</span></a>
    <a href="#/upcoming" data-tab="upcoming"><svg class="ti" aria-hidden="true"><use href="#i-flyer"/></svg><span>Upcoming</span></a>
    <a href="#/add" data-tab="add" class="addtab"><span class="stampdot" aria-hidden="true"><svg class="ti"><use href="#i-plus"/></svg></span><span>Add Show</span></a>
    <a href="#/stats" data-tab="stats"><svg class="ti" aria-hidden="true"><use href="#i-bars"/></svg><span>Stats</span></a>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
  </script>
</body>
</html>
